<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lezioni">
  <title>Registro lezioni</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎹%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <header class="top">
      <div><h1>Lezioni</h1><span id="status" class="st" aria-live="polite"></span></div>
      <div class="acts">
        <button id="exp" class="btn">EXPORT</button>
        <button id="auth" class="btn ghost">Accedi</button>
      </div>
    </header>
    <nav class="nav">
      <button id="prev" aria-label="Mese precedente">‹</button>
      <div class="sel"><select id="mSel" aria-label="Mese"></select><select id="ySel" aria-label="Anno"></select></div>
      <button id="next" aria-label="Mese successivo">›</button>
    </nav>
    <div id="msg" hidden></div>
    <main id="list"></main>
  </div>
  <div id="login" class="modal" hidden>
    <form id="lf" class="sheet">
      <h2>Accesso amministratore</h2>
      <input name="email" type="email" placeholder="Email" autocomplete="username" autocapitalize="none" required>
      <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <p id="le" class="err"></p>
      <div class="dl"><button type="button" id="lc" class="btn ghost">Annulla</button><button type="submit" class="btn">Entra</button></div>
    </form>
  </div>
  <div id="xm" class="modal" hidden>
    <div class="sheet wide">
      <h2>Export</h2>
      <pre id="xt"></pre>
      <div class="dl"><button type="button" id="xc" class="btn ghost">Chiudi</button><button type="button" id="xk" class="btn">COPIA</button></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
